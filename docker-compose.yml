services:
  postgres:
    image: postgres:16-alpine
    container_name: reservehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservehub
      POSTGRES_USER: reservehub
      POSTGRES_PASSWORD: reservehub
    ports:
      - "5432:5432"
    volumes:
      - reservehub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservehub -d reservehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reservehub-postgres-data:
